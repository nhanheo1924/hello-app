<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Settings</title>
</head>
<body style="margin:0;background:#050508;color:#fff;font-family:Times New Roman,serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="opacity:0.82;letter-spacing:0.04em;">Opening workspace settings...</div>
    <script>
        (() => {
            const url = new URL('../home/', window.location.href);
            const incoming = new URLSearchParams(window.location.search || '');
            incoming.set('openWorkspaceSettings', '1');
            url.search = incoming.toString();
            window.location.replace(`${url.pathname}${url.search}${url.hash}`);
        })();
    </script>
</body>
</html>
