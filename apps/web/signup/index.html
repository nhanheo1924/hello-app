<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-signin-client-id" content="">
    <title>Hello - Sign Up</title>
    <link rel="stylesheet" href="../src/pages/landing/landingpage.css">
    <link rel="stylesheet" href="../src/pages/signup/auth.css">
</head>
<body class="stars">
    <div class="particles">
        <div class="diamond" style="--size:6px; left:15%;"></div>
        <div class="diamond" style="--size:10px; left:35%;"></div>
        <div class="diamond" style="--size:4px; left:60%;"></div>
        <div class="diamond" style="--size:8px; left:85%;"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="../Resources/Logo.png" alt="Logo" class="mini-logo">
                <h2 id="auth-title">Create your account</h2>
                <p id="auth-subtitle">Sign up with email or Google and go straight to your workspace.</p>
            </div>

            <form id="auth-form">
                <div class="input-group">
                    <input type="text" id="first-name" placeholder="First name" aria-label="First name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="last-name" placeholder="Last name (optional)" aria-label="Last name">
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email address" aria-label="Email address" required>
                </div>
                <div id="email-error" class="error-message"></div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" aria-label="Password" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" aria-label="Confirm Password" required>
                </div>
                <div id="password-error" class="error-message"></div>
                <div id="password-policy" class="password-policy-container">
                    <p>Password must contain:</p>
                    <ul>
                        <li id="policy-length">At least 8 characters</li>
                        <li id="policy-uppercase">An uppercase letter</li>
                        <li id="policy-lowercase">A lowercase letter</li>
                        <li id="policy-number">A number</li>
                    </ul>
                </div>
                <button type="submit" id="submit-btn" class="btn primary full-width">Create Account</button>
                <div class="social-divider" aria-hidden="true"><span>or</span></div>
                <div id="google-signup-container" class="google-auth-container"></div>
                <div id="google-signup-error" class="error-message" aria-live="polite"></div>
            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="../signin/">Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="../src/pages/signup/main.ts"></script>
</body>
</html>
